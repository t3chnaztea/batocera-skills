<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="batocera-skills — agent skills for running a real arcade cabinet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2e"/>
      <stop offset="0.55" stop-color="#0d0620"/>
      <stop offset="1" stop-color="#080411"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1650"/>
      <stop offset="1" stop-color="#180a34"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect width="6" height="1" y="0" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#3a1d6e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a1d6e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- arcade marquee panel -->
  <g>
    <rect x="150" y="150" width="900" height="250" rx="14" fill="url(#marquee)" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="150" y="150" width="900" height="250" rx="14" fill="url(#scan)"/>
    <!-- marquee title -->
    <text x="600" y="272" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="92" letter-spacing="6" fill="#00e5ff">BATOCERA</text>
    <text x="600" y="352" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="58" letter-spacing="34" fill="#ff2e97">SKILLS</text>
  </g>

  <!-- tagline -->
  <text x="600" y="452" text-anchor="middle" font-family="'Courier New', monospace" font-size="27" fill="#e7defb">Agent skills for running a real arcade cabinet</text>

  <!-- skill chips -->
  <g font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#0d0620">
    <g transform="translate(214,500)">
      <rect width="118" height="42" rx="21" fill="#ffcc00"/><text x="59" y="28" text-anchor="middle">ops</text>
    </g>
    <g transform="translate(352,500)">
      <rect width="128" height="42" rx="21" fill="#ffcc00"/><text x="64" y="28" text-anchor="middle">roms</text>
    </g>
    <g transform="translate(500,500)">
      <rect width="150" height="42" rx="21" fill="#ffcc00"/><text x="75" y="28" text-anchor="middle">display</text>
    </g>
    <g transform="translate(670,500)">
      <rect width="150" height="42" rx="21" fill="#ffcc00"/><text x="75" y="28" text-anchor="middle">tuning</text>
    </g>
    <g transform="translate(840,500)">
      <rect width="196" height="42" rx="21" fill="#ffcc00"/><text x="98" y="28" text-anchor="middle">maintenance</text>
    </g>
  </g>

  <!-- insert coin -->
  <text x="600" y="588" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="7" fill="#ff2e97" opacity="0.85">■  INSERT COIN  ■</text>

  <!-- corner joystick motif -->
  <g transform="translate(96,96)" opacity="0.9">
    <ellipse cx="0" cy="52" rx="40" ry="12" fill="#241145"/>
    <rect x="-6" y="8" width="12" height="46" rx="6" fill="#5a3aa0"/>
    <circle cx="0" cy="6" r="16" fill="#ff2e97" stroke="#00e5ff" stroke-width="3"/>
  </g>
  <g transform="translate(1104,96)" opacity="0.9">
    <circle cx="0" cy="0" r="22" fill="#00e5ff"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0d0620" stroke-width="3"/>
    <circle cx="0" cy="34" r="22" fill="#ffcc00"/>
    <circle cx="0" cy="34" r="22" fill="none" stroke="#0d0620" stroke-width="3"/>
  </g>
</svg>
